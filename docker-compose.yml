version: '3.8'

services:
  # Servicio 1: Backend (Node.js + Express API)
  comedoru-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: comedoru-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=host.docker.internal  # Permite conectar a MySQL de XAMPP en Windows
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=comedor_u
      - DB_PORT=3306
      - JWT_SECRET=clave_super_secreta_comedoru
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # Servicio 2: Frontend (React + Vite + Nginx)
  comedoru-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comedoru-frontend
    ports:
      - "8080:80"
    depends_on:
      - comedoru-backend
    restart: always
